
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Inloggen | Fit Out Padel Destelbergen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

<div class="login-container">

    <h1 class="login-title"> Inloggen</h1>
    <p class="login-subtitle">Log in met je e-mailadres (geen wachtwoord nodig).</p>

    <form method="POST" action="/login">

        <label for="email" class="login-label">E-mailadres</label>
        <input type="email" id="email" name="email" 
               required placeholder="jouw@email.com"
               class="login-input">

        <button type="submit" class="login-btn">Inloggen</button>

        {% if error %}
        <div class="login-error">
            {{ error }}
        </div>
        {% endif %}
    </form>

    <a class="login-register-link" href="{{ url_for('register') }}">
        Nog geen account? Registreer hier
    </a>

</div>

</body>
</html>
