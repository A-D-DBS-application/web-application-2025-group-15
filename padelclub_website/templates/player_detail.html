<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Speler detail | Fit Out Padel Destelbergen</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0077cc, #00c6a7);
            color: #333;
            margin: 0;
            padding: 40px;
        }
        .container {
            background: #fff;
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        h1 { color: #0077cc; margin-top: 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
            vertical-align: top;
        }
        th {
            width: 25%;
            background: #f5f8ff;
        }
        textarea {
            width: 100%;
            min-height: 80px;
            resize: vertical;
            font-family: inherit;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary {
            background: #00a884;
            color: #fff;
        }
        .btn-primary:hover { background: #008e6e; }
        .btn-secondary {
            background: #ccc;
            color: #333;
        }
        .btn-secondary:hover { background: #b3b3b3; }
    </style>
</head>
<body>
<div class="container">
    <h1>Speler: {{ speler.first_name }} {{ speler.last_name }}</h1>

    <form method="post">
        <table>
            <tr>
                <th>E-mail</th>
                <td>{{ speler.email }}</td>
            </tr>
            <tr>
                <th>Telefoon</th>
                <td>{{ speler.phone or "-" }}</td>
            </tr>
            <tr>
                <th>Geslacht</th>
                <td>{{ speler.gender or "-" }}</td>
            </tr>
            <tr>
                <th>P-score</th>
                <td>{{ speler.ranking or "-" }}</td>
            </tr>
            <tr>
                <th>Handvoorkeur</th>
                <td>{{ speler.hand_preference or "-" }}</td>
            </tr>
            <tr>
                <th>Sterktes</th>
                <td>
                    <textarea name="strengths"
                              placeholder="Beschrijf hier de sterktes van deze speler">{{ speler.strengths or "" }}</textarea>
                </td>
            </tr>
            <tr>
                <th>Zwaktes</th>
                <td>
                    <textarea name="weaknesses"
                              placeholder="Beschrijf hier de werkpunten van deze speler">{{ speler.weaknesses or "" }}</textarea>
                </td>
            </tr>
        </table>

        <div class="buttons">
            <button type="submit" class="btn btn-primary">💾 Opslaan</button>
            <a href="{{ url_for('coach_dashboard') }}" class="btn btn-secondary">← Terug naar dashboard</a>
        </div>
    </form>
</div>
</body>
</html>
