<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Stap 2 – Tactiek</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="eval-page">

<div class="eval-container">
    <h2>Stap 2: Tactiek</h2>

    {% set tac = evaluation.get('tactiek', {}) %}

    <form method="POST">

        {% set items = {
            "positiespel": "Positiespel",
            "keuze_slagen": "Keuze van slagen",
            "samenwerking": "Samenwerking",
            "speelstrategie": "Speelstrategie"
        } %}

        {% for key, label in items.items() %}
            <label>{{ label }}</label>
            <select name="{{ key }}_score" required>
                <option value="">Kies een score</option>
                {% for i in range(1,11) %}
                    <option value="{{ i }}"
                        {% if tac.get(key)|int == i %}selected{% endif %}>
                        {{ i }}
                    </option>
                {% endfor %}
            </select>
        {% endfor %}

        <label>Opmerking tactiek</label>
        <textarea name="opmerking" rows="3">{{ tac.get('opmerking','') }}</textarea>

        <div class="eval-button-row">

            <!-- Vorige -->
            <a href="{{ url_for('evaluate_lesson', lesson_id=lesson.lesson_id, step=1) }}" 
               class="eval-btn eval-prev-btn">
               ← Vorige
            </a>

            <!-- Volgende -->
            <button type="submit" class="eval-btn eval-next-btn">
                Volgende → Fysiek
            </button>

        </div>

    </form>
</div>

</body>
</html>
