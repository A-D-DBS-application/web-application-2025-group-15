<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Stap 3 – Fysiek</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="eval-page">

<div class="eval-container">
    <h2>Stap 3: Fysiek</h2>

    {% set fys = evaluation.get('fysiek', {}) %}

    <form method="POST">

        {% set items = {
            "conditie": "Conditie",
            "reactiesnelheid": "Reactiesnelheid",
            "explosiviteit": "Explosiviteit"
        } %}

        {% for key, label in items.items() %}
            <label>{{ label }}</label>
            <select name="{{ key }}_score" required>
                <option value="">Kies een score</option>
                {% for i in range(1,11) %}
                    <option value="{{ i }}"
                        {% if fys.get(key)|int == i %}selected{% endif %}>
                        {{ i }}
                    </option>
                {% endfor %}
            </select>
        {% endfor %}

        <label>Opmerking fysiek</label>
        <textarea name="opmerking" rows="3">{{ fys.get('opmerking','') }}</textarea>

        <div class="eval-button-row">

            <!-- Vorige -->
            <a href="{{ url_for('evaluate_lesson', lesson_id=lesson.lesson_id, step=2) }}"
               class="eval-btn eval-prev-btn">
               ← Vorige
            </a>

            <!-- Volgende -->
            <button type="submit" class="eval-btn eval-next-btn">
                Volgende → Mentaal
            </button>

        </div>

    </form>
</div>

</body>
</html>
