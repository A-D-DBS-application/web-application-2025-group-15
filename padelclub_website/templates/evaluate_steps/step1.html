<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Stap 1 – Techniek</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="eval-page">

<div class="eval-container">
    <h2>Stap 1: Techniek</h2>

    {% set tech = evaluation.get('techniek', {}) %}

    <form method="POST">

        <!-- Forehand -->
        <label>Forehand</label>
        <select name="forehand_score">
            <option value="">Kies een score</option>
            {% for i in range(1,11) %}
                <option value="{{ i }}"
                    {% if tech.get('forehand')|int == i %}selected{% endif %}>
                    {{ i }}
                </option>
            {% endfor %}
        </select>

        <!-- Backhand -->
        <label>Backhand</label>
        <select name="backhand_score">
            <option value="">Kies een score</option>
            {% for i in range(1,11) %}
                <option value="{{ i }}"
                    {% if tech.get('backhand')|int == i %}selected{% endif %}>
                    {{ i }}
                </option>
            {% endfor %}
        </select>

        <!-- Volley -->
        <label>Volley</label>
        <select name="volley_score">
            <option value="">Kies een score</option>
            {% for i in range(1,11) %}
                <option value="{{ i }}"
                    {% if tech.get('volley')|int == i %}selected{% endif %}>
                    {{ i }}
                </option>
            {% endfor %}
        </select>

        <!-- Smash -->
        <label>Smash</label>
        <select name="smash_score">
            <option value="">Kies een score</option>
            {% for i in range(1,11) %}
                <option value="{{ i }}"
                    {% if tech.get('smash')|int == i %}selected{% endif %}>
                    {{ i }}
                </option>
            {% endfor %}
        </select>

        <!-- Opmerking -->
        <label>Opmerking techniek</label>
        <textarea name="opmerking" rows="3">{{ tech.get('opmerking','') }}</textarea>

        <div class="eval-button-row">
            <button type="submit" class="eval-next-btn">Volgende → Tactiek</button>

            <a href="{{ url_for('coach_dashboard') }}" class="eval-cancel-btn">
                Annuleren
            </a>
        </div>

    </form>
</div>

</body>
</html>
