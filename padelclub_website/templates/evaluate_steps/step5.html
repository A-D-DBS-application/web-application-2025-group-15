<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluatie Stap 5/5 | Overzicht</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding-bottom: 50px; }
        .eval-card { background-color: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        
        h1 { margin-bottom: 5px; color: white; }
        .step-indicator { color: #E10600; font-weight: bold; margin-bottom: 30px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .summary-text { color: #ccc; margin-bottom: 40px; line-height: 1.6; }
        
        .check-icon { font-size: 60px; display: block; margin-bottom: 20px; }

        .btn-finish {
            background-color: #28a745; /* Groen voor afronden */
            color: white;
            padding: 15px 30px;
            width: 100%;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-finish:hover { background-color: #218838; }

        .btn-back { display: inline-block; margin-top: 20px; color: #888; text-decoration: none; }
        .btn-back:hover { color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="eval-card">
        <span class="check-icon">📝</span>
        <h1>Klaar om op te slaan?</h1>
        <div class="step-indicator">Stap 5 van 5</div>

        <p class="summary-text">
            Je hebt alle onderdelen ingevuld.<br>
            Klik hieronder om de evaluatie definitief te maken en naar de speler te sturen.
        </p>

        <form method="POST">
            <button type="submit" class="btn-finish">✅ Definitief Opslaan</button>
        </form>

        <a href="{{ url_for('evaluate_lesson', lesson_id=lesson.lesson_id, step=4) }}" class="btn-back">← Terug naar aanpassen</a>
    </div>
</div>

</body>
</html>
