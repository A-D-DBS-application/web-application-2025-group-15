<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bevestig Groepsles | Fit Out Padel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* --- DARK MODE STYLING --- */
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            margin: 0;
        }

        .container-custom {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 20px;
        }

        .form-card {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border: 1px solid #333;
            text-align: center;
        }

        h1 { margin-bottom: 10px; color: white; }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }

        /* Review Details Box */
        .review-details {
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-bottom: 30px;
        }

        .review-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #444;
            padding: 10px 0;
        }

        .review-row:last-child {
            border-bottom: none;
        }

        .label { color: #ccc; font-weight: normal; }
        .value { color: white; font-weight: bold; }

        /* Actie Knoppen */
        .primary-btn {
            background-color: #E10600;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
            box-sizing: border-box; /* Zorgt dat padding de breedte niet verpest */
        }

        .primary-btn:hover { background-color: #b30500; }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link:hover { color: #E10600; }

    </style>
</head>
<body class="index-page">

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Fit Out Logo" style="max-height: 40px;">
            </a>
            <ul class="navbar-menu">
                <li><a href="{{ url_for('player_dashboard') }}" class="nav-link">Dashboard</a></li>
                <li><a href="{{ url_for('request_lesson_type') }}" class="nav-link">Les aanvragen</a></li>
                <li><a href="{{ url_for('logout') }}" class="nav-btn-logout">Uitloggen</a></li>
            </ul>
        </div>
    </nav>

    <div class="container-custom">
        <div class="form-card">
            <h1>Check je aanvraag</h1>
            <p class="subtitle">Controleer de gegevens hieronder voordat je bevestigt.</p>

            <div class="review-details">
                
                <div class="review-row">
                    <span class="label">Coach:</span>
                    <span class="value">{{ coach.first_name }} {{ coach.last_name }}</span>
                </div>

                <div class="review-row">
                    <span class="label">Datum:</span>
                    <span class="value">{{ date }}</span>
                </div>

                <div class="review-row">
                    <span class="label">Tijd:</span>
                    <span class="value">{{ start }} - {{ end }}</span>
                </div>

                <div class="review-row">
                    <span class="label">Onderwerp:</span>
                    <span class="value" style="color: #E10600;">{{ focus }}</span>
                </div>

            </div>

            <a href="{{ url_for(
                'finalize_group_lesson_request',
                coach_id=coach.coach_id,
                date=date,
                start=start,
                focus=focus
            ) }}" class="primary-btn">
                Definitief Bevestigen
            </a>

            <a href="{{ url_for('request_group_lesson') }}" class="back-link">
                ← Wijzigen / Annuleren
            </a>

        </div>
    </div>

</body>
</html>
