<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Registreren Speler</title>
    <style>
        /* EXACT DEZELFDE STIJL ALS JE VORIGE HTML */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0077cc, #00c6a7);
            color: #333;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 { text-align: center; color: #0077cc; margin-bottom: 5px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0077cc; color: white; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-weight: bold; font-size: 15px; }
        button:hover { background-color: #005fa3; }
        .back-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .back-link a { color: #666; text-decoration: none; }
        .error { color: red; text-align: center; margin-bottom: 10px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Speler Account</h1>
        
        {% if error %} <p class="error">{{ error }}</p> {% endif %}

        <form method="POST" action="/register/player">
            <label for="first_name">Voornaam:</label>
            <input type="text" name="first_name" required>

            <label for="last_name">Achternaam:</label>
            <input type="text" name="last_name" required>

            <label for="email">E-mailadres:</label>
            <input type="email" name="email" required>

            <label for="phone">Telefoonnummer:</label>
            <input type="text" name="phone">

            <label for="wachtwoord">Wachtwoord:</label>
            <input type="password" name="wachtwoord" required>

            <button type="submit">Account Aanmaken</button>
        </form>

        <div class="back-link">
            <a href="/register">← Terug naar keuze</a>
        </div>
    </div>
</body>
</html>
