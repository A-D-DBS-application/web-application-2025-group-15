<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profiel bewerken</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-bg">

<div class="container">

    <h2>Profiel bewerken</h2>
    <hr>

    <!-- FORM MOET enctype HEBBEN VOOR BESTANDSUPLOAD -->
    <form method="POST" enctype="multipart/form-data">

        <!-- Profielfoto preview -->
        <div style="text-align:center; margin-bottom:20px;">
            {% if profile.profile_image %}
                <img src="{{ profile.profile_image }}" class="profile-pic-large">
            {% else %}
                <img src="/static/default_profile.png" class="profile-pic-large">
            {% endif %}
        </div>

        <!-- Foto upload veld -->
        <label>Nieuwe profielfoto uploaden:</label>
        <input type="file" name="image" accept="image/*" class="file-input">

        <!-- Naam -->
        <label>Voornaam</label>
        <input type="text" name="first_name" value="{{ profile.first_name }}" required>

        <label>Achternaam</label>
        <input type="text" name="last_name" value="{{ profile.last_name }}" required>

        <!-- Contact -->
        <label>E-mail</label>
        <input type="email" name="email" value="{{ profile.email }}" required>

        <label>Telefoonnummer</label>
        <input type="text" name="phone" value="{{ profile.phone }}">

        <!-- Enkel spelers hebben DOB -->
        {% if profile.date_of_birth is not none %}
            <label>Geboortedatum</label>
            <input type="date" name="dob" value="{{ profile.date_of_birth }}">
        {% endif %}

        <!-- Gender -->
        <label>Gender</label>
        <select name="gender" class="ranking-select">
            <option value="">Niet gespecificeerd</option>
            <option value="man"   {% if profile.gender == 'man' %}selected{% endif %}>Man</option>
            <option value="vrouw" {% if profile.gender == 'vrouw' %}selected{% endif %}>Vrouw</option>
            <option value="x"     {% if profile.gender == 'x' %}selected{% endif %}>X</option>
        </select>

        <!-- Ranking -->
        <label>Ranking</label>
        <select name="ranking" class="ranking-select">
            <option value="">Geen ranking</option>
            {% for r in ["P50","P100","P200","P300","P400","P500","P700","P1000"] %}
                <option value="{{ r }}" {% if profile.ranking == r %}selected{% endif %}>
                    {{ r }}
                </option>
            {% endfor %}
        </select>
        
        <!-- Lesvoorkeur -->
        <label>Lesvoorkeur</label>
        <select name="lesson_type_preference" class="ranking-select">
            <option value="">Geen voorkeur opgegeven</option>
            <option value="group"
                {% if profile.lesson_type_preference == "group" %}selected{% endif %}>
                Groepslessen
            </option>
            <option value="individual"
                {% if profile.lesson_type_preference == "individual" %}selected{% endif %}>
                Individuele lessen
            </option>
        </select>

        <!-- Speelstijl -->
        <label>Speelstijl</label>
        <select name="playing_intensity" class="ranking-select">
            <option value="">Geen speelstijl opgegeven</option>
            <option value="recreational"
                {% if profile.playing_intensity == "recreational" %}selected{% endif %}>
                Recreatief / ontspanning
            </option>
            <option value="competitive"
                {% if profile.playing_intensity == "competitive" %}selected{% endif %}>
                Serieus / competitief
            </option>
        </select>

        <div class="eval-button-row" style="margin-top: 30px;">

            {% if session['role'] == 'coach' %}
                <a href="{{ url_for('coach_dashboard') }}" class="button back-btn">Annuleren</a>
            {% else %}
                <a href="{{ url_for('player_dashboard') }}" class="button back-btn">Annuleren</a>
            {% endif %}

            <button type="submit" class="button">Opslaan ✔</button>
        </div>

    </form>

</div>

</body>
</html>
