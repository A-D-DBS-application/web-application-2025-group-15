<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Les annuleren | Bevestigen</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0077cc, #00c6a7);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .modal {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
        }

        a.btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .confirm {
            background-color: #dc3545;
            color: white;
        }

        .cancel {
            background-color: #0077cc;
            color: white;
            margin-right: 10px;
        }
    </style>
</head>

<body>
<div class="modal">
    <h2>Weet je zeker dat je deze les wilt annuleren?</h2>

    <a href="{{ url_for('player_dashboard') }}" class="btn cancel">Nee, terug</a>
    <a href="{{ url_for('cancel_lesson', lesson_id=lesson_id) }}" class="btn confirm">Ja, annuleer les</a>
</div>
</body>
</html>
