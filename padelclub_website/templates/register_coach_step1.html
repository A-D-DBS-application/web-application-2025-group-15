<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coach Registratie Stap 1/2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container form-container">
        <h1>Stap 1: Coach Profiel</h1>
        <p class="subtitle">Stap 1 van 2</p>
        
        {% if error %} <div class="error">{{ error }}</div> {% endif %}

        <form method="POST" action="{{ url_for('register_coach') }}">
            <label for="first_name">Voornaam:</label>
            <input type="text" name="first_name" required placeholder="Bijv. Jan">

            <label for="last_name">Achternaam:</label>
            <input type="text" name="last_name" required placeholder="Bijv. Peeters">

            <label for="email">E-mailadres:</label>
            <input type="email" name="email" required placeholder="jan@coach.be">

            <label for="phone">Telefoonnummer:</label>
            <input type="text" name="phone" placeholder="04...">

            <button type="submit" class="form-btn">Volgende stap &rarr;</button>
        </form>

        <div class="back-link">
            <a href="/register">← Terug naar keuze</a>
        </div>
    </div>
</body>
</html>
