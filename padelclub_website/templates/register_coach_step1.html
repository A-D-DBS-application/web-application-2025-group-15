<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registratie Coach (1/2) | Fit Out Padel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="index-page">
    <div class="login-container dark-card">
        
        <h1 class="login-title">Coach Profiel</h1>
        <p class="login-subtitle">Stap 1 van 2: Persoonlijke gegevens</p>
        
        {% if error %} <div class="login-error">{{ error }}</div> {% endif %}

        <form method="POST" action="{{ url_for('register_coach') }}">
            <label for="first_name" class="login-label">Voornaam</label>
            <input type="text" name="first_name" required placeholder="Bijv. Jan" class="login-input">

            <label for="last_name" class="login-label">Achternaam</label>
            <input type="text" name="last_name" required placeholder="Bijv. Peeters" class="login-input">

            <label for="email" class="login-label">E-mailadres</label>
            <input type="email" name="email" required placeholder="jan@coach.be" class="login-input">

            <label for="phone" class="login-label">Telefoonnummer</label>
            <input type="text" name="phone" placeholder="04..." class="login-input">

            <button type="submit" class="login-btn">Volgende stap &rarr;</button>
        </form>

        <div class="back-home">
            <a href="/register">← Terug naar keuze</a>
        </div>
    </div>
</body>
</html>
