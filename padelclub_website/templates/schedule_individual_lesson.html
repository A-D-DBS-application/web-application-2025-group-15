<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Les Inplannen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container form-container">
        <h1>📅 Nieuwe Les</h1>
        <p class="subtitle">Individuele sessie inplannen</p>

        {% if error %}
            <div class="error" style="text-align:center; margin-bottom:15px;">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            
            <label for="player_id">Kies een speler:</label>
            <select name="player_id" id="player_id" required>
                <option value="" disabled selected>-- Selecteer speler --</option>
                {% for student in students %}
                    <option value="{{ student.player_id }}">
                        {{ student.first_name }} {{ student.last_name }} ({{ student.ranking }})
                    </option>
                {% endfor %}
            </select>

            <label for="date">Datum:</label>
            <input type="date" id="date" name="date" required>

            <label for="start_time">Starttijd:</label>
            <input type="time" id="start_time" name="start_time" required>

            <label for="duration">Duur (minuten):</label>
            <select name="duration" id="duration">
                <option value="30">30 minuten</option>
                <option value="60" selected>60 minuten (Standaard)</option>
                <option value="90">90 minuten</option>
                <option value="120">120 minuten</option>
            </select>

            <button type="submit" class="form-btn">Les Bevestigen ✅</button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('coach_dashboard') }}">← Terug naar dashboard</a>
        </div>
    </div>

    <script>
        const dateInput = document.getElementById('date');
        if (dateInput) {
            dateInput.min = new Date().toISOString().split("T")[0];
        }
    </script>

</body>
</html>
