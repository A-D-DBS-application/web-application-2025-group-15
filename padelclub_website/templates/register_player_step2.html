<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Speler Registratie Stap 2/2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container form-container">
        
        <h1>Stap 2: Speler Profiel</h1>
        <p class="subtitle">Nog even wat details...</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <!-- BELANGRIJK: enctype toevoegen -->
        <form method="POST" action="{{ url_for('register_player_step2') }}" enctype="multipart/form-data">

            <label for="ranking">Je P-Ranking:</label>
            <select name="ranking" id="ranking" required>
                <option value="" disabled selected>Kies je ranking...</option>
                <option value="Geen">Geen ranking (Beginner)</option>
                <option value="P50">P50</option>
                <option value="P100">P100</option>
                <option value="P200">P200</option>
                <option value="P300">P300</option>
                <option value="P400">P400</option>
                <option value="P500">P500</option>
                <option value="P700">P700</option>
                <option value="P1000">P1000</option>
            </select>

            <label for="hand_preference">Speelhand:</label>
            <select name="hand_preference" id="hand_preference" required>
                <option value="" disabled selected>Maak een keuze</option>
                <option value="rechts">Rechts</option>
                <option value="links">Links</option>
                <option value="beide">Beide</option>
            </select>

            <label for="gender">Geslacht:</label>
            <select name="gender" id="gender" required>
                <option value="" disabled selected>Kies je geslacht...</option>
                <option value="man">Man</option>
                <option value="vrouw">Vrouw</option>
                <option value="anders">Anders</option>
            </select>

            <label>Geboortedatum:</label>
            <input type="date" name="dob" required>

            <!-- FOTO UPLOAD TOEGEVOEGD -->
            <label>Profielfoto:</label>
            <input type="file" name="image" accept="image/*" required>

            <button type="submit" class="form-btn">
                Speler Registratie Afronden ✅
            </button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('register_player_step1') }}">← Terug naar stap 1</a>
        </div>

    </div>
</body>
</html>
