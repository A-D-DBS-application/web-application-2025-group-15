<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Les aanvragen | Fit Out Padel Destelbergen</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0077cc, #00c6a7);
            color: #333;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 600px;
            margin: auto;
        }

        h1 {
            color: #0077cc;
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #00a884;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #008e6e;
        }

        p.error {
            color: red;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: #0077cc;
        }

        .back-link {
            text-align:center;
            margin-top:15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Les aanvragen</h1>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <!-- STAP 1: Coach + datum kiezen -->
        <form method="post">
            <input type="hidden" name="step" value="choose">

            <label for="coach_id">Kies coach:</label>
            <select name="coach_id" required>
                <option value="">-- Selecteer coach --</option>
                {% for coach in coaches %}
                    <option value="{{ coach.coach_id }}"
                        {% if selected_coach_id and selected_coach_id|string == coach.coach_id|string %}selected{% endif %}>
                        {{ coach.first_name }} {{ coach.last_name }} ({{ coach.email }})
                    </option>
                {% endfor %}
            </select>

            <label for="date">Datum:</label>
            <input type="date" name="date" required
                   value="{{ selected_date if selected_date }}">

            <button type="submit">Toon beschikbare timeslots</button>
        </form>

        <!-- STAP 2: Timeslot kiezen (alleen tonen als we slots hebben) -->
        {% if available_slots and available_slots|length > 0 %}
        <hr style="margin: 25px 0;">

        <form method="post">
            <input type="hidden" name="step" value="book">
            <input type="hidden" name="coach_id" value="{{ selected_coach_id }}">
            <input type="hidden" name="date" value="{{ selected_date }}">

            <label for="time_slot">Kies een vrij tijdslot:</label>
            <select name="time_slot" required>
                <option value="">-- Selecteer tijdslot --</option>
                {% for slot in available_slots %}
                    <option value="{{ slot.start }}-{{ slot.end }}">
                        {{ slot.start }} – {{ slot.end }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Les boeken</button>
        </form>
        {% endif %}

        <p class="back-link">
            <a href="{{ url_for('player_dashboard') }}">← Terug naar dashboard</a>
        </p>
    </div>
</body>
</html>
