<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Les aanvragen | Fit Out Padel Destelbergen</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0077cc, #00c6a7);
            margin: 0;
            padding: 40px;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        h1 { color: #0077cc; }
        label { font-weight: bold; display:block; margin-top:10px; }
        select, input {
            width: 100%;
            padding: 8px;
            margin-top:5px;
            border-radius:8px;
            border:1px solid #ccc;
        }
        .button {
            display:inline-block;
            margin-top:20px;
            background:#00a884;
            color:white;
            padding:10px 18px;
            border-radius:8px;
            text-decoration:none;
            font-weight:bold;
            border:none;
            cursor:pointer;
        }
        .button.secondary {
            background:#0077cc;
        }
        .button:hover { opacity:0.9; }
        .error {
            margin-top:10px;
            color:red;
            font-weight:bold;
        }
        ul.timeslots {
            list-style:none;
            padding-left:0;
            margin-top:10px;
        }
        ul.timeslots li {
            margin:4px 0;
        }

        .cancel-link {
            color: #0077cc;
            font-weight: bold;
            margin-left: 15px;
            text-decoration: none;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }
        .cancel-link:hover {
            color: #005fa3;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📅 Les aanvragen</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label for="coach_id">Kies coach:</label>
        <select name="coach_id" id="coach_id" required>
            <option value="">-- Selecteer coach --</option>
            {% for c in coaches %}
                <option value="{{ c.coach_id }}"
                    {% if selected_coach_id and selected_coach_id|int == c.coach_id %}selected{% endif %}>
                    {{ c.first_name }} {{ c.last_name }}
                </option>
            {% endfor %}
        </select>

        <label for="date">Kies datum:</label>
        <input type="date" id="date" name="date"
               value="{{ selected_date or '' }}" required>

        <button type="submit" name="action" value="show_slots" class="button secondary">
            Toon beschikbare tijdsloten
        </button>

        <a href="{{ url_for('player_dashboard') }}" class="cancel-link">
            Annuleren
        </a>
    </form>

    {% if available_slots %}
        <hr>
        <h2>Beschikbare tijdsloten</h2>
        <form method="POST">
            <input type="hidden" name="coach_id" value="{{ selected_coach_id }}">
            <input type="hidden" name="date" value="{{ selected_date }}">

            <ul class="timeslots">
                {% for slot in available_slots %}
                    <li>
                        <label>
                            <input type="radio" name="slot" value="{{ slot.id }}" required>
                            {{ slot.label }}
                        </label>
                    </li>
                {% endfor %}
            </ul>

            <button type="submit" name="action" value="book" class="button">
                Boek deze les
            </button>

            <a href="{{ url_for('player_dashboard') }}" class="cancel-link">
                Annuleren
            </a>
        </form>
    {% endif %}
</div>
</body>
</html>
