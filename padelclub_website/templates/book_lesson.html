<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Les aanvragen | Fit Out Padel Destelbergen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container card">
    <h1> Les aanvragen</h1>

    {% if error %}
        <div class="alert alert-error">❌ {{ error }}</div>
    {% endif %}

    <!-- FORM 1 -->
    <form method="POST" class="card section">
        <label class="form-label">Kies coach:</label>
        <select name="coach_id" class="form-input" required>
            <option value="">-- Selecteer coach --</option>
            {% for c in coaches %}
                <option value="{{ c.coach_id }}"
                    {% if selected_coach_id and selected_coach_id|int == c.coach_id %}selected{% endif %}>
                    {{ c.first_name }} {{ c.last_name }}
                </option>
            {% endfor %}
        </select>

        <label class="form-label">Kies datum:</label>
        <input type="date" name="date" class="form-input" value="{{ selected_date or '' }}" required>

        <div class="form-actions">
            <button type="submit" name="action" value="show_slots" class="button button-primary">
                Toon beschikbare tijdsloten
            </button>
            <a href="{{ url_for('player_dashboard') }}" class="cancel-link">Annuleren</a>
        </div>
    </form>

    {% if available_slots %}
        <hr>

        <h2 class="section-title">Beschikbare tijdsloten</h2>

        <!-- FORM 2 -->
        <form method="POST">
            <input type="hidden" name="coach_id" value="{{ selected_coach_id }}">
            <input type="hidden" name="date" value="{{ selected_date }}">

            {% for slot in available_slots %}
                <label class="availability-item">
                    <span class="availability-time">{{ slot.label }}</span>
                    <input type="radio" name="slot" value="{{ slot.id }}" required>
                </label>
            {% endfor %}

            <div class="form-actions">
                <button type="submit" name="action" value="book" class="button button-success">
                    Boek deze les
                </button>
                
            </div>
        </form>
    {% endif %}
</div>
</body>
</html>
